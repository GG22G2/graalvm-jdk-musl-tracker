name: build-arm

# 手动触发：构建一次 linux/arm64 的 Oracle GraalVM + Maven 工具镜像，
# 推送到阿里云 ACR 的固定 tag graalvm-oracle-jdk25-arm-musl-maven。
#
# 与 build.yml / build-oracle.yml 完全独立：本工作流不写 built-tag 文件，
# 也不被 check-upstream* 触发，定时任务和原有构建逻辑一行未改。
on:
  workflow_dispatch:

env:
  MAVEN_VERSION: 3.9.16
  # Oracle GraalVM arm64，JDK 25.0.4。
  # 用 ol8（glibc 2.28）而不是 ol10（glibc 2.39）：目标机银河麒麟 V10 SP1 是
  # glibc 2.31，glibc 不向前兼容，必须用 <= 2.31 的环境构建。
  # 注意：Oracle 的 *-muslib-* 系列没有 arm64，arm64 只出现在 glibc 系列。
  BASE_IMAGE: container-registry.oracle.com/graalvm/native-image:25i4-25.0.4.1.1-ol8-20260922
  # 目标部署机的 glibc 版本上限（银河麒麟 V10 SP1）
  TARGET_GLIBC: "2.31"
  ALIYUN_REGISTRY: crpi-xm8affxmcnbpks63.cn-shanghai.personal.cr.aliyuncs.com
  ALIYUN_IMAGE: crpi-xm8affxmcnbpks63.cn-shanghai.personal.cr.aliyuncs.com/gg22g2/ck
  ALIYUN_TAG: graalvm-oracle-jdk25-arm-musl-maven

jobs:
  build:
    # 公有仓库可用的原生 arm64 runner；用 amd64 + QEMU 跑 native-image 会慢到不可用
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build arm64 image
        run: |
          echo "base = $BASE_IMAGE"
          docker build --platform linux/arm64 \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg MAVEN_VERSION="$MAVEN_VERSION" \
            --label "org.opencontainers.image.base.name=$BASE_IMAGE" \
            --label "org.opencontainers.image.arch=arm64" \
            -f Dockerfile.arm \
            -t "$ALIYUN_IMAGE:$ALIYUN_TAG" .

      - name: Verify tools
        run: |
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" java -version
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" native-image --version
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" mvn -version
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" git --version
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" bash --version | head -1
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" jq --version

      - name: Assert Yunxiao requirements
        # 云效要求自定义镜像含 bash + jq、默认用户为 root，
        # 且会以 /bin/bash 作为 entrypoint 起容器（官方文档 custom-build-environment）。
        # 这里用 bash -lc（login shell）复现云效行为。
        # 最关键的是最后一步：云效会往环境里注入自己的 glibc 二进制（node16 等），
        # 镜像必须是 glibc（存在 ld-linux-aarch64.so.1），否则会报
        #   cannot execute: required file not found
        run: |
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" bash -lc '
            set -e
            for t in bash jq java javac native-image mvn git; do
              command -v "$t" >/dev/null || { echo "缺少 $t"; exit 1; }
            done
            [ -x /bin/bash ] || { echo "缺少 /bin/bash"; exit 1; }
            echo "{\"ok\":true}" | jq -e ".ok == true" >/dev/null
            echo "uid=$(id -u) user=$(id -un) PATH=$PATH"
            [ "$(id -u)" = "0" ] || { echo "默认用户不是 root"; exit 1; }
            echo "libc: $(ldd --version 2>&1 | head -1)"
            ls -l /usr/lib/ld-linux-aarch64.so.1 || ls -l /lib/ld-linux-aarch64.so.1
            echo "云效前置检查通过"
          '
          echo "--- 模拟云效启动方式（entrypoint=/bin/bash）:"
          docker run --rm --entrypoint=/bin/bash "$ALIYUN_IMAGE:$ALIYUN_TAG" -lc 'echo "bash entrypoint OK: $BASH_VERSION"; mvn -v | head -1'

      - name: Assert glibc binaries can actually run
        # 直接验证 glibc 动态链接可用：编一个最小的 glibc C 程序并运行。
        # 这一步失败就说明云效注入的 node16 一定跑不起来。
        run: |
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" bash -lc '
            set -e
            printf "#include <stdio.h>\nint main(){printf(\"glibc-ok\\\\n\");return 0;}\n" > /tmp/t.c
            cc /tmp/t.c -o /tmp/t
            file /tmp/t | head -1
            /tmp/t
            echo "glibc 动态链接验证通过"
          '

      - name: Assert produced binary targets a compatible glibc
        # 决定性验证：真编一个 native-image 产物，检查它引用的最高 GLIBC 符号版本。
        # glibc 不向前兼容 —— 若产物引用了 GLIBC_2.32+，在麒麟 V10 SP1（2.31）上
        # 会直接报 `version GLIBC_2.xx not found`。这里必须在推镜像前拦住。
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -e TARGET_GLIBC="$TARGET_GLIBC" \
            "$ALIYUN_IMAGE:$ALIYUN_TAG" bash -lc '
              set -e
              cd /tmp
              echo "public class Hello { public static void main(String[] a){ System.out.println(\"ok\"); } }" > Hello.java
              javac Hello.java
              native-image -cp . Hello
              echo "--- 构建机 glibc: $(ldd --version | head -1)"
              echo "--- 产物依赖的 GLIBC 符号版本:"
              NEED=$(readelf --version-info ./hello 2>/dev/null \
                     | grep -oE "GLIBC_[0-9]+\.[0-9]+" | sort -Vu | tail -1 | sed "s/GLIBC_//")
              echo "最高 GLIBC 符号 = ${NEED:-无}"
              if [ -z "$NEED" ]; then
                echo "产物未引用 GLIBC 符号（可能是静态链接），放行"
                exit 0
              fi
              HIGHEST=$(printf "%s\n%s\n" "$NEED" "$TARGET_GLIBC" | sort -V | tail -1)
              if [ "$HIGHEST" != "$TARGET_GLIBC" ]; then
                echo "::error::产物需要 GLIBC_$NEED，高于目标机麒麟 V10 SP1 的 $TARGET_GLIBC，会报 version not found"
                exit 1
              fi
              echo "兼容性检查通过：产物最高需要 GLIBC_$NEED <= 目标机 $TARGET_GLIBC"
              ./hello
            '

      - name: Assert image is arm64
        # ELF e_machine 前两字节：b7 00 = AArch64，3e 00 = x86-64
        run: |
          MACHINE=$(docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" \
            sh -c 'od -An -tx1 -j18 -N2 "$(command -v java)" | tr -d " \n"')
          echo "e_machine = $MACHINE"
          if [ "$MACHINE" != "b700" ]; then
            echo "::error::镜像不是 linux/arm64（e_machine=$MACHINE）"
            exit 1
          fi

      - name: Push to Aliyun ACR
        run: |
          docker push "$ALIYUN_IMAGE:$ALIYUN_TAG"
          echo "pushed $ALIYUN_IMAGE:$ALIYUN_TAG"
