name: verify-arm-image
on:
  workflow_dispatch:
env:
  ALIYUN_REGISTRY: crpi-xm8affxmcnbpks63.cn-shanghai.personal.cr.aliyuncs.com
  ALIYUN_IMAGE: crpi-xm8affxmcnbpks63.cn-shanghai.personal.cr.aliyuncs.com/gg22g2/ck
  ALIYUN_TAG: graalvm-oracle-jdk25-arm-musl-maven
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Pull from Aliyun and inspect without local cache
        run: |
          docker rmi "$ALIYUN_IMAGE:$ALIYUN_TAG" 2>/dev/null || true
          docker pull "$ALIYUN_IMAGE:$ALIYUN_TAG"
          echo "--- repo digest / arch from Aliyun:"
          docker manifest inspect "$ALIYUN_IMAGE:$ALIYUN_TAG" | head -40
          echo "--- local inspect:"
          docker image inspect "$ALIYUN_IMAGE:$ALIYUN_TAG" --format '{{.Architecture}} {{.Os}} {{.Created}}'
          echo "--- run:"
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" java -version
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" native-image --version
          docker run --rm "$ALIYUN_IMAGE:$ALIYUN_TAG" uname -m
